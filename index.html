<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Sahaf</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --sky1:#5a91df;
  --sky2:#9e9add;
  --sky3:#b7a9ea;
  --ink:#172030;
  --panel:#fff3c8;
  --panel2:#f8e7a9;
  --outline:#223044;
  --grass:#6bb246;
  --grass2:#91d35d;
}
body{
  margin:0;
  color:var(--ink);
  background:var(--sky1);
  font-family:"Courier New", monospace;
  image-rendering:pixelated;
  overflow-x:hidden;
}
a{color:inherit}
.hero{
  width:100%;
  min-height:56vw;
  max-height:760px;
  background:#76a0dd;
  overflow:hidden;
  position:relative;
}
.hero img{
  width:100%;
  height:100%;
  min-height:56vw;
  max-height:760px;
  object-fit:cover;
  object-position:center top;
  display:block;
  image-rendering:auto;
}
.sky-page{
  position:relative;
  min-height:1800px;
  padding:52px 0 110px;
  background:
    linear-gradient(180deg, rgba(83,139,219,.94) 0%, rgba(139,143,218,.95) 38%, rgba(180,162,232,.96) 100%);
  overflow:hidden;
}
/* soft moving pixel clouds, no black grid */
.sky-page::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg, transparent 0 8%, rgba(255,255,255,.16) 8% 18%, transparent 18% 100%),
    linear-gradient(90deg, transparent 0 28%, rgba(255,255,255,.12) 28% 42%, transparent 42% 100%),
    linear-gradient(90deg, transparent 0 64%, rgba(255,255,255,.14) 64% 76%, transparent 76% 100%),
    linear-gradient(0deg, transparent 0 12%, rgba(255,255,255,.10) 12% 22%, transparent 22% 100%);
  background-size:520px 260px, 680px 320px, 760px 360px, 590px 300px;
  animation:clouds 32s linear infinite;
  opacity:.75;
  pointer-events:none;
}
.sky-page::after{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:22px;
  background:linear-gradient(90deg,#4e87d1 0 12%, #8a95de 12% 27%, #658fd8 27% 44%, #b7a5e6 44% 65%, #7198db 65% 100%);
  opacity:.55;
}
@keyframes clouds{to{background-position:520px 0, -680px 0, 760px 0, -590px 0}}
.world{
  position:relative;
  width:min(1160px,86vw);
  margin:0 auto;
  z-index:2;
}
.search-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  width:min(780px,86vw);
  margin:0 auto 58px;
}
.folder{font-size:34px;filter:drop-shadow(3px 3px 0 #21304c)}
.search-box{
  position:relative;
  flex:1;
  border:4px solid #1d415c;
  background:#fff0af;
  box-shadow:0 0 0 4px #79d5c1,6px 6px 0 rgba(31,46,67,.25);
  height:58px;
  display:flex;
  align-items:center;
  padding:0 62px 0 24px;
}
.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#5b533d;
  font:18px "Courier New", monospace;
}
.search-icon{
  position:absolute;
  right:16px;
  top:10px;
  font-size:34px;
  line-height:1;
}
.frog{
  width:56px;height:56px;
  border:4px solid #223044;
  background:#73c65c;
  box-shadow:inset 10px 0 #4eb947, inset -10px 0 #93dd72, 5px 5px 0 rgba(31,46,67,.24);
  border-radius:8px 8px 14px 14px;
  position:relative;
}
.frog::before,.frog::after{content:"";position:absolute;top:8px;width:9px;height:9px;background:#f9f2cf;border:3px solid #223044;border-radius:50%}
.frog::before{left:9px}.frog::after{right:9px}
.archive-section{
  margin:0 auto 70px;
  width:min(1060px,82vw);
  position:relative;
}
.archive-section h2{
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
  margin:0 0 6px 30px;
  color:#172030;
  text-shadow:2px 2px 0 rgba(255,255,255,.35);
}
.mushroom{font-size:24px;margin-left:8px;vertical-align:-3px}
.pixel-panel{
  min-height:176px;
  width:100%;
  border:8px solid #202e42;
  border-radius:18px;
  background:
    linear-gradient(180deg, rgba(255,247,214,.98), rgba(255,238,187,.98));
  box-shadow:
    0 8px 0 #142033,
    inset 0 0 0 4px rgba(255,255,255,.45),
    inset 0 -12px 0 rgba(236,205,139,.28);
  padding:24px 34px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.empty-note{
  width:100%;
  min-height:95px;
  border:5px dashed rgba(31,46,67,.26);
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(31,46,67,.52);
  font-size:18px;
}
.book-row{
  width:100%;
  min-height:160px;
  display:flex;
  align-items:flex-end;
  gap:18px;
  justify-content:center;
  padding:6px 0 0;
}
.book-spine{
  --book:#702d4b;
  --bookText:#f8d36e;
  width:82px;
  height:150px;
  border:5px solid #172030;
  border-radius:7px 9px 5px 5px;
  background:
    linear-gradient(90deg, rgba(255,255,255,.13) 0 9px, transparent 9px 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 5px, transparent 5px 13px),
    var(--book);
  box-shadow:7px 7px 0 rgba(31,46,67,.22), inset -10px 0 rgba(0,0,0,.18);
  color:var(--bookText);
  padding:10px 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.book-spine span{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-size:10px;
  line-height:1.05;
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.4px;
  max-height:130px;
  overflow:hidden;
  text-shadow:1px 1px 0 #172030;
}
.book-spine:nth-child(1){--book:#87294f;--bookText:#f7d56a;}
.book-spine:nth-child(2){--book:#184579;--bookText:#f3d573;}
.book-spine:nth-child(3){--book:#1f6d45;--bookText:#f0e6a6;}
.book-spine:nth-child(4){--book:#7b441d;--bookText:#ffe1a8;}
.book-spine:nth-child(5){--book:#9a2e2e;--bookText:#ffd48f;}
.book-spine:nth-child(6){--book:#4c3a8b;--bookText:#f6dd90;}
.add-book{
  width:74px;
  height:120px;
  align-self:flex-end;
  border:5px dashed #223044;
  border-radius:8px;
  background:#fff6ca;
  box-shadow:5px 5px 0 rgba(31,46,67,.18), inset 0 -10px 0 rgba(235,211,137,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  transition:transform .15s ease;
}
.add-book:hover{transform:translateY(-5px)}
.add-book span{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#ffef79;
  color:#1b2a43;
  border:4px solid #223044;
  font-size:34px;
  font-weight:bold;
}
.pixel-grass{
  position:absolute;
  left:-8vw;right:-8vw;bottom:0;height:66px;
  background:
    linear-gradient(90deg,#348946 0 12%,#58b348 12% 22%,#2f7d43 22% 40%,#82c95d 40% 54%,#3d944b 54% 77%,#73bf55 77% 100%);
  opacity:.55;
}
.cat{position:fixed;left:26px;bottom:18px;width:70px;z-index:20;image-rendering:pixelated}
.fish-bubble{position:fixed;left:78px;bottom:88px;display:none;z-index:21;background:#dcf8ff;border:4px solid #24445e;padding:8px;border-radius:50%;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.fish-bubble img{width:44px;image-rendering:pixelated}
.cat-area.active .fish-bubble{display:block}

.fish-bubble{cursor:pointer;transition:transform .12s ease;}
.fish-bubble:hover{transform:translateY(-4px) scale(1.06);}
.cat.cat-run{
  animation:catRun 1.15s steps(6) 1;
}
@keyframes catRun{
  0%{transform:translateX(0) translateY(0) scaleX(1)}
  18%{transform:translateX(26px) translateY(-6px) scaleX(1)}
  38%{transform:translateX(86px) translateY(0) scaleX(1)}
  58%{transform:translateX(126px) translateY(-8px) scaleX(1)}
  78%{transform:translateX(64px) translateY(0) scaleX(-1)}
  100%{transform:translateX(0) translateY(0) scaleX(1)}
}

@media(max-width:800px){
 .hero{min-height:63vw}
 .hero img{min-height:63vw}
 .world{width:92vw}
 .archive-section{width:88vw;margin-bottom:58px}
 .pixel-panel{min-height:160px;padding:20px 16px}
 .book-row{gap:10px;overflow-x:auto;justify-content:flex-start;padding-bottom:10px}
 .book-spine{min-width:68px;width:68px;height:136px}
 .add-book{min-width:66px;width:66px;height:112px}
 .search-wrap{width:88vw}
 .frog{display:none}
}
</style>
</head>
<body>
  <header class="hero">
    <img src="Dijital Sahaf.jpg" onerror="this.src='hero-pixel-world.jpg'" alt="Dijital Sahaf pixel giriş görseli">
  </header>
  <main class="sky-page">
    <div class="world">
      <form class="search-wrap" onsubmit="return false;">
        <span class="folder">📁</span>
        <label class="search-box">
          <input id="siteSearch" type="search" placeholder="Arşivde ara..." aria-label="Arşivde ara">
          <span class="search-icon">⌕</span>
        </label>
        <span class="frog" aria-hidden="true"></span>
      </form>
      <section class="archive-section fotograflar">
  <h2>Fotoğraflar<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">Fotoğraflar buraya eklenecek.</div></div>
</section>
<section class="archive-section kitaplar">
  <h2>Kitaplar<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="book-row">
<button class="book-spine" type="button" aria-label="Gurur ve Önyargı">
  <span>Gurur ve Önyargı</span>
</button>
<button class="book-spine" type="button" aria-label="Sefiller 1-2">
  <span>Sefiller 1-2</span>
</button>
<button class="book-spine" type="button" aria-label="Seyir Defteri">
  <span>Seyir Defteri</span>
</button>
<button class="book-spine" type="button" aria-label="İnsan Neyle Yaşar?">
  <span>İnsan Neyle Yaşar?</span>
</button>
<button class="book-spine" type="button" aria-label="Romeo ve Juliet">
  <span>Romeo ve Juliet</span>
</button>
<button class="book-spine" type="button" aria-label="Genç Werther">
  <span>Genç Werther</span>
</button>
<a class="add-book" href="library.html" aria-label="Kütüphaneye git"><span>+</span></a>
</div></div>
</section>
<section class="archive-section kasetler">
  <h2>Kasetler<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">Kasetler buraya eklenecek.</div></div>
</section>
<section class="archive-section plaklar">
  <h2>Plaklar<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">Plaklar buraya eklenecek.</div></div>
</section>
<section class="archive-section cdler">
  <h2>CDler<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">CDler buraya eklenecek.</div></div>
</section>
<section class="archive-section dvdler">
  <h2>DVDler<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">DVDler buraya eklenecek.</div></div>
</section>
<section class="archive-section vcdler">
  <h2>VCDler<span class="mushroom" aria-hidden="true">🍄</span></h2>
  <div class="pixel-panel"><div class="empty-note">VCDler buraya eklenecek.</div></div>
</section>
    </div>
    <div class="pixel-grass" aria-hidden="true"></div>
  </main>
  <div class="cat-area" id="catArea">
    <img class="cat" id="cat" src="oldschool_cat.png" onerror="this.style.display='none'" alt="Arşiv görevlisi pixel kedi">
    <div class="fish-bubble" id="fishBubble"><img src="oldschool_blue_fish_v11.png" alt="mavi pixel balık"></div>
  </div>
<script>
(function(){
  const search=document.getElementById('siteSearch');
  const sections=[...document.querySelectorAll('.archive-section')];
  search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase();
    sections.forEach(sec=>{
      const text=sec.textContent.toLowerCase();
      sec.style.display=!q||text.includes(q)?'block':'none';
    });
  });
  const cat=document.getElementById('cat');
  const area=document.getElementById('catArea');
  const fishBubble=document.getElementById('fishBubble');
  let hideFishTimer=null;
  function showFish(){
    area.classList.add('active');
    clearTimeout(hideFishTimer);
    hideFishTimer=setTimeout(()=>area.classList.remove('active'),5000);
  }
  function runCat(){
    if(!cat) return;
    cat.classList.remove('cat-run');
    void cat.offsetWidth;
    cat.classList.add('cat-run');
    showFish();
  }
  if(cat) cat.addEventListener('click',showFish);
  if(fishBubble) fishBubble.addEventListener('click',(event)=>{
    event.stopPropagation();
    runCat();
  });
})();
</script>
</body>
</html>
